title: "新手套装"
description: "主菜单 Mod 列表内提供大面板设置界面，使用勾选框开关 7 项功能，默认全部关闭：食物保鲜、简化复制人、自动打印、打印舱选项刷新、机械飞升、技能点满级不增加、自动破碎流星。简化复制人仅作用于标准复制人，固定 3 个特质：健步如飞、健美者、潜水员之肺；仿生复制人完全保持原版；起始技能点保持原版。打印舱左侧独立面板提供补给包多选自动打印列表；打印舱“选择蓝图”界面可为单个复制人或补给包显示刷新按钮；机械飞升可在打印舱前将标准复制人与仿生人互相转换，转换后技能点清零；自动破碎流星会在常规流星进入地图时将其击碎，灾星事件不受影响。兼容全部 DLC 与混合组合。"
